services:
  - type: web
    name: fashionfinder
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port 8001 --workers 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.12
      - key: KMP_DUPLICATE_LIB_OK
        value: "TRUE"
    healthCheckPath: /health
